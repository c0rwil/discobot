[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discobot"
version = "0.1.0"
description = "Discord music bot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "discord.py",
  "dotenv",
  "yt-dlp",
  "PyNaCl",
]

[project.scripts]
discobot = "discobot.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
