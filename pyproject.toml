[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discobot"
version = "0.1.0"
description = "Discord music bot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "discord.py>=2.3.2",
  "dotenv",
  "yt-dlp",
  "pynacl,
]

[project.scripts]
discobot = "discobot:main"